name: Pipeline CI CD - Java

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify

      - name: Generar archivo JAR
        run: mvn -B package -DskipTests

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn

      - name: Publicar aplicacion JAR
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-java
          path: target/pipeline-ci-cd-java-1.0-SNAPSHOT.jar

  deploy:
    name: Despliegue en ambiente de prueba
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Descargar aplicacion JAR
        uses: actions/download-artifact@v4
        with:
          name: aplicacion-java
          path: target

      - name: Preparar ambiente de prueba
        run: mkdir -p deployment/test-environment

      - name: Ejecutar despliegue
        run: bash deployment/deploy.sh

      - name: Verificar aplicacion desplegada
        run: test -s deployment/test-environment/app.jar
